site_name: loopit Docs
site_dir: ../site
theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - toc.follow
    - toc.integrate
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  icon:
    repo: fontawesome/brands/github
repo_name: loopit
repo_url: https://github.com/webscout9-png/loopit
edit_uri: ''

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/webscout9-png/loopit
      name: loopit
    - icon: fontawesome/brands/discourse
      link: https://thinktank.ottomator.ai/
      name: loopit Discourse
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/bolt_diy
      name: loopit on X
    - icon: fontawesome/brands/bluesky
      link: https://bsky.app/profile/loopit
      name: loopit on Bluesky

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.mark
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - FAQ: FAQ.md
  - Contributing: CONTRIBUTING.md
